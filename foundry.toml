[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./test/safe/bytecode" }, { access = "read-write", path = "./sdk/test/fixtures" }]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "safe-1.4.1/=lib/safe-v1.4.1/contracts/",
    "safe-1.5.0/=lib/safe-v1.5.0/contracts/",
]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 128
fail_on_revert = false